<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7f5af0;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7f5af0;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2cb67d;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2cb67d;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)" rx="18"/>

  <!-- Ambient glows -->
  <ellipse cx="160" cy="110" rx="160" ry="120" fill="url(#glow1)"/>
  <ellipse cx="760" cy="110" rx="160" ry="120" fill="url(#glow2)"/>

  <!-- Decorative ring left -->
  <circle cx="90" cy="110" r="54" fill="none" stroke="#7f5af0" stroke-width="1.5" opacity="0.4"/>
  <circle cx="90" cy="110" r="36" fill="none" stroke="#7f5af0" stroke-width="1" opacity="0.25"/>
  <circle cx="90" cy="110" r="16" fill="#7f5af0" opacity="0.55"/>

  <!-- Radial lines left (visualiser motif) -->
  <g transform="translate(90,110)" opacity="0.5" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round">
    <line x1="0" y1="-22" x2="0" y2="-50"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(45)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(90)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(135)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(180)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(225)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(270)"/>
    <line x1="0" y1="-22" x2="0" y2="-50" transform="rotate(315)"/>
  </g>

  <!-- Decorative ring right -->
  <circle cx="810" cy="110" r="54" fill="none" stroke="#2cb67d" stroke-width="1.5" opacity="0.4"/>
  <circle cx="810" cy="110" r="36" fill="none" stroke="#2cb67d" stroke-width="1" opacity="0.25"/>
  <circle cx="810" cy="110" r="16" fill="#2cb67d" opacity="0.55"/>

  <!-- Radial lines right -->
  <g transform="translate(810,110)" opacity="0.5" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round">
    <line x1="0" y1="-22" x2="0" y2="-44"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(45)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(90)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(135)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(180)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(225)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(270)"/>
    <line x1="0" y1="-22" x2="0" y2="-44" transform="rotate(315)"/>
  </g>

  <!-- Title -->
  <text x="450" y="100" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1" fill="white">MyPlaylist</text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="18" font-weight="400" fill="#a8b2d8" letter-spacing="0.5">Your offline music, organised your way.</text>

  <!-- Tags -->
  <text x="450" y="178" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="13" fill="#7f5af0" letter-spacing="2">iOS  ·  Swift  ·  SwiftUI  ·  AVFoundation</text>
</svg>
